name: GENERIC HANDLER - PARENT - UKDEV
description: |-
  Vendor-neutral parent handler. Five stages, read top to bottom:

    1. SETUP    placeholder fields, customer context, SLA timers
    2. ROUTE    SIEM SELECT -> ingest adapter for the source (or MANUAL REVIEW)
    3. ENRICH   indicators -> GTI -> cross-incident prevalence -> HTML overview
    4. DECIDE   recurrence count -> ESCALATION MATRIX
    5. ACT      ESCALATE | RECURRING | AUTO-CLOSE -> AI narrative -> SYNC back to source

  Adapter contract - each SIEM has two sub-playbooks:
    INGEST AND INVESTIGATE - <SIEM>   must output CanonicalIncident and ExtractedEntities
    SYNC - <SIEM>                     takes Comment + Disposition, writes back to the source
  Everything between SIEM SELECT and SYNC SELECT references CanonicalIncident, ExtractedEntities,
  IncidentIndicators and Triage.* only. Never a vendor context path.

  Context keys owned by this playbook (Triage.*): Narrative, TuningSummary, Disposition.
  Incident fields written: AI Summary, Incident Overview, closeNotes - all standard, nothing to create.

  Fail-safe rules:
    - Unknown source or failed ingest -> MANUAL REVIEW, fields updated so the analyst knows why.
    - Enrichment, prevalence, render, recurrence and write-back are best effort - they degrade, never stop.
    - Matrix default is ESCALATE. Auto-close requires a parsed closing note or it escalates.
    - RECURRING raises a tuning ticket and still escalates the occurrence.

  Not included (needs custom fields/lists first): allow-list filtering, fingerprint-based dedup,
  observability flags. All were deliberately removed to keep this plug-and-play.
