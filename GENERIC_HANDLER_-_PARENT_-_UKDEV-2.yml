inputs:
- key: LogAnalyticsInstance
  value:
    simple: WC_Tyrell_SoC_LAW
  required: true
  description: Azure Log Analytics integration instance for this customer. Passed
    to the Sentinel ingest adapter. Sentinel itself is targeted via incident.sourceInstance
    and needs no input.
  playbookInputQuery: null
- key: AIInstance
  value:
    simple: FOUNDRY-POC-TP
  required: true
  description: Azure OpenAI integration instance used for summaries, closing notes
    and tuning summaries.
  playbookInputQuery: null
- key: AutoCloseSeverities
  value:
    simple: 3,4
  required: true
  description: 'Comma-separated CanonicalIncident.severity values eligible for auto-close.
    Canonical scale: 1=Critical, 2=High, 3=Medium, 4=Low. Confirm against SeverityMapper-UKDev
    output before enabling in production.'
  playbookInputQuery: null
- key: RecurrenceLookbackDays
  value:
    simple: "7"
  required: true
  description: Lookback window in days when counting previous incidents with the same
    name.
  playbookInputQuery: null
- key: RecurrenceThreshold
  value:
    simple: "3"
  required: true
  description: Prior occurrences within the window at which the incident is treated
    as RECURRING.
  playbookInputQuery: null
- key: EnrichWaitSeconds
  value:
    simple: "20"
  required: true
  description: Pause between enrichIndicators and re-reading the verdicts, so DBot
    scores have settled.
  playbookInputQuery: null
- key: TuningIncidentType
  value:
    simple: Tuning Request
  required: true
  description: Incident type for tuning review tickets. Must exist and must NOT have
    this playbook as its default - otherwise recurring incidents recurse.
  playbookInputQuery: null
outputs:
- contextPath: CanonicalIncident
  description: Vendor-neutral canonical incident object.
  type: unknown
- contextPath: IncidentIndicators
  description: Enriched indicators associated with the incident.
  type: unknown
- contextPath: RecurrenceCount
  description: Previous incidents with the same name within the lookback window.
  type: unknown
- contextPath: Triage.Disposition
  description: 'Final outcome: ESCALATED, AUTO-CLOSED or MANUAL-REVIEW.'
  type: unknown
- contextPath: Triage.Narrative
  description: AI summary or closing note written to the incident and synced to the
    source.
  type: unknown
dirtyInputs: true
