      resource_group_name:
        simple: ${Sentinel.ResourceGroup}
      subscription_id:
        simple: ${Sentinel.SubscriptionId}
      using:
        simple: ${incident.sourceInstance}
    loop:
      iscommand: false
      exitCondition: ''
      wait: 45
      max: 4
      builtincondition:
      - - operator: isNotEmpty
          left:
            value:
              simple: AzureSentinel.IncidentEntity
            iscontext: true
          right:
            value: {}
    separatecontext: false
