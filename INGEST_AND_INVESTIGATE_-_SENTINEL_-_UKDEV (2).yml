name: INGEST AND INVESTIGATE - SENTINEL - UKDEV
description: |-
  Microsoft Sentinel ingest adapter. ADAPTER CONTRACT v1.0.
  Parses the source refs once, pulls entities and the analytics rule in parallel, maps
  severity, builds the triage fingerprint, runs a severity-gated investigation pack, then
  emits CanonicalIncident, ExtractedEntities and Investigation. Nothing vendor-specific
  leaves this playbook.
