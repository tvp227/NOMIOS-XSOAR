inputs:
- key: Comment
  value:
    simple: ''
  required: true
  description: Narrative to post back to the Sentinel incident.
  playbookInputQuery: null
- key: Disposition
  value:
    simple: ''
  required: true
  description: 'Triage outcome: ESCALATED, AUTO-CLOSED or DUPLICATE. Drives the comment prefix and the status update.'
  playbookInputQuery: null
- key: MarkActiveOnEscalate
  value:
    simple: 'true'
  required: true
  description: If true, non-closing dispositions set the Sentinel incident to Active. Set false for customers who manage status themselves.
  playbookInputQuery: null
- key: CloseClassification
  value:
    simple: Undetermined
  required: true
  description: 'Sentinel classification used when closing: Undetermined, BenignPositive, FalsePositive or TruePositive.'
  playbookInputQuery: null
- key: CloseClassificationReason
  value:
    simple: ''
  required: false
  description: Required by Sentinel for BenignPositive (SuspiciousButExpected) and FalsePositive (IncorrectAlertLogic / InaccurateData). Leave empty for Undetermined.
  playbookInputQuery: null
