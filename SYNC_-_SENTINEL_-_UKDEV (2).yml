name: SYNC - SENTINEL - UKDEV
description: |-
  Microsoft Sentinel write-back adapter.

  Called by GENERIC HANDLER - PARENT after the escalation matrix has decided an outcome.
    1. Posts the triage narrative back to the source incident as a comment.
    2. Mirrors the outcome onto the Sentinel status: Closed for AUTO-CLOSED / DUPLICATE,
       Active for everything else (optional via MarkActiveOnEscalate).

  Rules:
    - No decision logic and no AI calls live here. The parent decides, this playbook only reports.
    - Errors propagate to the parent, which flags SYNC_FAILED and carries on. Triage is never
      failed by a write-back problem.
    - Targets incident.sourceInstance, so it is multi-tenant safe without configuration.

  Input contract:
    - Comment       narrative text to post
    - Disposition   ESCALATED | AUTO-CLOSED | DUPLICATE
