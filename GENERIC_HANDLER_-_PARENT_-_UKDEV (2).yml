  '22':
    id: '22'
    taskid: c2b3d36e-6fac-42cd-b77c-fef93deda159
    type: condition
    task:
      id: c2b3d36e-6fac-42cd-b77c-fef93deda159
      version: -1
      name: ESCALATION MATRIX
      description: |-
        First match wins, evaluated top to bottom:
          1. DUPLICATE  an incident with the same fingerprint is still open - link to it and close this one.
          2. ESCALATE   any indicator has a malicious or suspicious GTI verdict - nothing below overrides this.
          3. RECURRING  same fingerprint seen >= RecurrenceThreshold times in RecurrenceLookbackDays (all closed). Tuning ticket, then escalate.
          4. INFRASTRUCTURE ALERT  name starts with INF. Labelled stub that escalates - wire dedicated handling here.
          5. AUTO-CLOSE severity is in AutoCloseSeverities. Only reached when 1-4 did not match.
          default       ESCALATE. An incident that matches nothing is never dropped and never auto-closed.
      type: condition
      iscommand: false
      brand: ''
    nexttasks:
      '#default#':
      - '23'
      DUPLICATE:
      - '70'
      ESCALATE:
      - '63'
      RECURRING:
      - '30'
      INFRASTRUCTURE ALERT:
      - '36'
      AUTO-CLOSE:
      - '40'
    separatecontext: false
    conditions:
    - label: DUPLICATE
      condition:
      - - operator: isNotEmpty
          left:
            value:
              simple: Triage.OpenDuplicate
            iscontext: true
          right:
            value: {}
    - label: ESCALATE
      condition:
      - - operator: isTrue
          left:
            value:
              simple: IncidentIndicators.HasGTIMaliciousOrSuspicious
            iscontext: true
          right:
            value: {}
    - label: RECURRING
      condition:
      - - operator: greaterThanOrEqual
          left:
            value:
              simple: RecurrenceCount
            iscontext: true
          right:
            value:
              simple: inputs.RecurrenceThreshold
            iscontext: true
    - label: INFRASTRUCTURE ALERT
      condition:
      - - operator: startWith
          left:
            value:
              simple: incident.name
            iscontext: true
          right:
            value:
              simple: INF
    - label: AUTO-CLOSE
      condition:
      - - operator: inList
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: ${inputs.AutoCloseSeverities}
    continueonerrortype: ''
    view: |-
      {
        "position": {
          "x": 480,
          "y": 4190
        }
      }
