name: GENERIC HANDLER - PARENT - UKDEV
description: |-
  Vendor-neutral parent handler.

  Flow:
    loading placeholders -> customer context -> SLA init -> SIEM SELECT -> <ingest adapter>
    -> fingerprint -> allow-list filter -> GTI enrichment -> cross-incident prevalence -> overview render
    -> recurrence / duplicate search -> ESCALATION MATRIX
    -> DUPLICATE | ESCALATE | RECURRING | AUTO-CLOSE -> narrative -> disposition -> SYNC SELECT -> <write-back adapter>

  Adapter contract. Each SIEM has two sub-playbooks:
    INGEST AND INVESTIGATE - <SIEM>   must output CanonicalIncident, ExtractedEntities, IngestPath
    SYNC - <SIEM>                     takes Comment + Disposition, posts back and mirrors status
  Everything between SIEM SELECT and SYNC SELECT references CanonicalIncident, ExtractedEntities,
  IncidentIndicators and Triage.* only. Never a vendor context path.

  Context keys owned by this playbook (Triage.*):
    Fingerprint, EnrichTargets, PrevalentIndicators, OpenDuplicate, Narrative, TuningSummary,
    Disposition, Path (list of observability flags)

  Incident fields this playbook writes and that must exist:
    Triage Fingerprint (short text, searchable), Triage Disposition (single select / short text),
    Triage Path (multi select / tags), AI Summary, Incident Overview, closeNotes

  Fail-safe rules:
    - Unknown source or failed ingest -> MANUAL REVIEW (fields updated, analyst told why).
    - Enrichment, prevalence, rendering, recurrence and write-back are best effort - they flag and degrade, never stop.
    - Matrix default is ESCALATE. Auto-close requires a parsed closing note or it escalates.
    - RECURRING raises a tuning ticket and still escalates the occurrence.
    - DUPLICATE only fires against an OPEN incident with the same fingerprint.
