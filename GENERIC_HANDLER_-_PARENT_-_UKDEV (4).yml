inputs:
- key: LogAnalyticsInstance
  value:
    simple: WC_Tyrell_SoC_LAW
  required: true
  description: Azure Log Analytics instance for this customer workspace. Passed to the ingest adapter.
  playbookInputQuery: null
- key: AIInstance
  value:
    simple: FOUNDRY-POC-TP
  required: true
  description: Azure OpenAI instance used for summaries, closing notes and tuning summaries.
  playbookInputQuery: null
- key: AutoCloseSeverities
  value:
    simple: 3,4
  required: true
  description: 'Canonical severity values eligible for auto-close. Scale: 1 Critical, 2 High, 3 Medium,
    4 Informational.'
  playbookInputQuery: null
- key: FullInvestigationSeverities
  value:
    simple: 1,2,3
  required: true
  description: Canonical severities that get the full investigation-led AI prompt. Others get the short
    closing-note prompt.
  playbookInputQuery: null
- key: RecurrenceLookbackDays
  value:
    simple: '7'
  required: true
  description: Lookback in days when counting prior incidents with the same triage fingerprint.
  playbookInputQuery: null
- key: RecurrenceThreshold
  value:
    simple: '3'
  required: true
  description: Prior occurrences within the window at which the incident is treated as RECURRING.
  playbookInputQuery: null
- key: EnrichWaitSeconds
  value:
    simple: '20'
  required: true
  description: Pause between enrichIndicators and re-reading verdicts so DBot scores have settled.
  playbookInputQuery: null
- key: TuningIncidentType
  value:
    simple: Tuning Request
  required: true
  description: Incident type for tuning review tickets. Must NOT have this playbook as its default or
    recurring incidents recurse.
  playbookInputQuery: null
- key: AutoCloseRecurring
  value:
    simple: 'false'
  required: true
  description: OFF BY DEFAULT. When true, low-severity recurrences that already have an open tuning ticket
    auto-close as FalsePositive instead of escalating.
  playbookInputQuery: null
- key: MarkActiveOnEscalate
  value:
    simple: 'true'
  required: true
  description: Passed to the sync adapter. When false the source incident status is left alone and only
    a comment is posted.
  playbookInputQuery: null
- key: OwnerUPN
  value: {}
  required: false
  description: Optional. UPN of the XSOAR service principal to set as owner on the source incident.
  playbookInputQuery: null
- key: SyncTags
  value:
    simple: XSOAR-Triaged
  required: true
  description: Comma-separated tags applied to the source incident on write-back.
  playbookInputQuery: null
outputs:
- contextPath: CanonicalIncident
  description: Vendor-neutral canonical incident object.
  type: unknown
- contextPath: IncidentIndicators
  description: Enriched indicators linked to this incident.
  type: unknown
- contextPath: Investigation
  description: Distilled automated investigation results from the ingest adapter.
  type: unknown
- contextPath: RecurrenceCount
  description: Prior incidents with the same fingerprint in the lookback window.
  type: number
- contextPath: Triage.Disposition
  description: ESCALATED, RECURRING, AUTO-CLOSED or MANUAL-REVIEW.
  type: string
- contextPath: Triage.Narrative
  description: Narrative written to the incident and posted to the source SIEM.
  type: string
