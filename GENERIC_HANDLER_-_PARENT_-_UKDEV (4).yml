name: GENERIC HANDLER - PARENT - UKDEV
description: |-
  Vendor-neutral triage handler. ADAPTER CONTRACT v1.0.
  Five stages: SETUP, ROUTE, ENRICH, DECIDE, ACT. Between SIEM SELECT and SYNC SELECT
  it references only CanonicalIncident, ExtractedEntities, IncidentIndicators,
  Investigation.* and Triage.*, never a vendor context path.
  A new SIEM is one ingest adapter, one sync adapter, one branch on each SELECT.
