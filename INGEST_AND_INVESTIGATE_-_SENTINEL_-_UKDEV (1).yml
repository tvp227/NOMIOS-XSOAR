name: INGEST AND INVESTIGATE - SENTINEL - UKDEV
description: |-
  Microsoft Sentinel ingest and investigate adapter.

  Responsibilities (all Sentinel-specific logic lives here):
    1. Parse subscription / resource group / incident ID from the incident URL (once).
    2. Pull incident entities via a looped sub-playbook (GET ENTITIES - SENTINEL) and normalise them.
    3. Capture the triggering analytics rule and re-run its query over its own period.
    4. Map Sentinel severity to the canonical 1-4 scale.
    5. Build the vendor-neutral CanonicalIncident object.

  Resilience rules:
    - Entities and rule investigation are enrichment. Every failure in those branches flags the
      IngestPath and skips to SEVERITY MAP so the incident is always built.
    - No write-back to Sentinel from this playbook. That is SYNC - SENTINEL's job, after triage.
    - All Sentinel commands target incident.sourceInstance. Only the Log Analytics workspace is a
      configured input, because it cannot be derived from the incident.

  Output contract (consumed by GENERIC HANDLER - PARENT):
    - CanonicalIncident   vendor-neutral incident object (always set)
    - ExtractedEntities   flat list of entity values (unset when Sentinel returned none)
    - IngestPath          list of observability flags raised during ingest
