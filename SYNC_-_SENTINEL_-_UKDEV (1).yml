name: SYNC - SENTINEL - UKDEV
description: |-
  Microsoft Sentinel write-back adapter.

  Called by GENERIC HANDLER - PARENT after the escalation matrix has decided an outcome.
  Posts the triage narrative back to the source Sentinel incident as a comment.

  Rules:
    - No decision logic and no AI calls live here. The parent decides, this playbook only reports.
    - Write-back is best effort. Failure here never fails the parent.
    - Targets the instance the incident was fetched from (incident.sourceInstance), so it is
      multi-tenant safe without configuration.

  Input contract:
    - Comment       narrative text to post (AI summary or closing note)
    - Disposition   ESCALATED | RECURRING | AUTO-CLOSED - prefixed to the comment
