    taskid: bdf3bacd-0424-4460-b992-70f1570bd039
    type: condition
    task:
      id: bdf3bacd-0424-4460-b992-70f1570bd039
      version: -1
      name: ESCALATION MATRIX
      description: |-
        First match wins, top to bottom:
          1. ESCALATE   any indicator has a malicious or suspicious GTI verdict. Nothing below overrides this.
          2. RECURRING  same name seen >= RecurrenceThreshold times in RecurrenceLookbackDays. Tuning ticket, then escalate.
          3. INFRASTRUCTURE ALERT  name starts with INF. Stub - currently just escalates.
          4. AUTO-CLOSE severity is in AutoCloseSeverities. Only reached if 1-3 did not match.
          default       ESCALATE. Nothing is ever dropped or auto-closed by accident.
      type: condition
      iscommand: false
      brand: ''
    nexttasks:
      '#default#':
      - '23'
      ESCALATE:
      - '23'
      RECURRING:
      - '30'
      INFRASTRUCTURE ALERT:
      - '36'
      AUTO-CLOSE:
      - '40'
    separatecontext: false
    conditions:
    - label: ESCALATE
      condition:
      - - operator: isTrue
          left:
            value:
              simple: IncidentIndicators.HasGTIMaliciousOrSuspicious
            iscontext: true
          right:
            value: {}
    - label: RECURRING
      condition:
      - - operator: greaterThanOrEqual
          left:
            value:
              simple: RecurrenceCount
            iscontext: true
          right:
            value:
              simple: inputs.RecurrenceThreshold
            iscontext: true
    - label: INFRASTRUCTURE ALERT
      condition:
      - - operator: startWith
          left:
            value:
              simple: incident.name
            iscontext: true
          right:
            value:
              simple: INF
    - label: AUTO-CLOSE
      condition:
      - - operator: inList
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: ${inputs.AutoCloseSeverities}
