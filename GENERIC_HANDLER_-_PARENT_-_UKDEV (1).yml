    id: '22'
    taskid: ed2beff6-df7b-4e19-b373-950c78b60a91
    type: condition
    task:
      id: ed2beff6-df7b-4e19-b373-950c78b60a91
      version: -1
      name: ESCALATION MATRIX
      description: |-
        First match wins, evaluated top to bottom:
          1. ESCALATE   any indicator has a malicious or suspicious GTI verdict - nothing overrides this.
          2. RECURRING  same incident name seen >= RecurrenceThreshold times in RecurrenceLookbackDays. Raises a tuning ticket, then escalates.
          3. INFRASTRUCTURE ALERT  name starts with INF. Currently a labelled stub that escalates - wire dedicated handling here.
          4. AUTO-CLOSE severity is in the AutoCloseSeverities input. Only reached when 1-3 did not match.
          default       ESCALATE. An incident that matches nothing is never dropped and never auto-closed.
      type: condition
      iscommand: false
      brand: ''
    nexttasks:
      '#default#':
      - '23'
      ESCALATE:
      - '23'
      RECURRING:
      - '30'
      INFRASTRUCTURE ALERT:
      - '36'
      AUTO-CLOSE:
      - '40'
    separatecontext: false
    conditions:
    - label: ESCALATE
      condition:
      - - operator: isTrue
          left:
            value:
              simple: IncidentIndicators.HasGTIMaliciousOrSuspicious
            iscontext: true
          right:
            value: {}
    - label: RECURRING
      condition:
      - - operator: greaterThanOrEqual
          left:
            value:
              simple: RecurrenceCount
            iscontext: true
          right:
            value:
              simple: inputs.RecurrenceThreshold
            iscontext: true
    - label: INFRASTRUCTURE ALERT
      condition:
      - - operator: startWith
          left:
            value:
              simple: incident.name
            iscontext: true
          right:
            value:
              simple: INF
    - label: AUTO-CLOSE
      condition:
