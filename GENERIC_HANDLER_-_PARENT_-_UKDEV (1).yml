name: GENERIC HANDLER - PARENT - UKDEV
description: |-
  Vendor-neutral parent handler.

  Flow:
    loading placeholders -> customer context -> SLA init -> SIEM SELECT -> <ingest adapter>
    -> indicator enrichment -> overview render -> recurrence check -> ESCALATION MATRIX
    -> ESCALATE | RECURRING | AUTO-CLOSE -> AI narrative -> SYNC SELECT -> <write-back adapter>

  Adapter contract. Each SIEM has two sub-playbooks:
    INGEST AND INVESTIGATE - <SIEM>   must output CanonicalIncident and ExtractedEntities
    SYNC - <SIEM>                     takes Comment + Disposition, posts back to the source
  Everything between SIEM SELECT and SYNC SELECT references CanonicalIncident, ExtractedEntities,
  IncidentIndicators and Triage.* only. Never a vendor context path.

  Fail-safe rules:
    - Unknown source or failed ingest -> MANUAL REVIEW (fields updated, analyst told why).
    - Enrichment, rendering, recurrence and write-back are best effort - they degrade, never stop.
    - Matrix default is ESCALATE. Auto-close requires a generated closing note or it escalates.
    - RECURRING raises a tuning ticket and still escalates the occurrence.
