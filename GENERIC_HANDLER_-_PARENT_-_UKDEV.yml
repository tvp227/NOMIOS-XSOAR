name: GENERIC HANDLER - PARENT - UKDEV
description: |-
  Vendor-neutral parent handler.

  Routes the incident to the correct SIEM ingest/investigate sub-playbook, which
  must output:
    - CanonicalIncident   (vendor-neutral incident object)
    - ExtractedEntities   (flat list of entity values for indicator handling)

  Everything after the SIEM SELECT stage references CanonicalIncident /
  ExtractedEntities only. Never reference vendor-specific context paths in the
  shared section - add them to the relevant sub-playbook instead.

  Shared stages: indicator extraction and enrichment -> recurrence check ->
  escalation matrix (GTI verdict / recurrence / auto-close). Recurring
  incidents raise a tuning review incident for detection engineering, then
  escalate.
