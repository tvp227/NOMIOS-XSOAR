inputs:
- key: SentinelInstance
  value:
    simple: WC_Tyrell_SoC
  required: true
  description: Azure Sentinel integration instance name.
  playbookInputQuery: null
- key: LogAnalyticsInstance
  value:
    simple: WC_Tyrell_SoC_LAW
  required: true
  description: Azure Log Analytics integration instance name.
  playbookInputQuery: null
- key: AIInstance
  value:
    simple: FOUNDRY-POC-TP
  required: true
  description: Azure OpenAI integration instance used for summaries and closing notes.
  playbookInputQuery: null
- key: AutoCloseSeverities
  value:
    simple: 3,4
  required: true
  description: 'Comma-separated CanonicalIncident.severity values eligible for auto-close
    (canonical scale: 1=Critical, 2=High, 3=Medium, 4=Low).'
  playbookInputQuery: null
- key: RecurrenceLookbackDays
  value:
    simple: "7"
  required: true
  description: Lookback window in days used to count previous incidents with the same
    name when evaluating recurrence.
  playbookInputQuery: null
- key: RecurrenceThreshold
  value:
    simple: "3"
  required: true
  description: Number of previous occurrences within the lookback window at which
    an incident is treated as RECURRING - it is escalated and a tuning review incident
    is raised.
  playbookInputQuery: null
- key: TuningIncidentType
  value:
    simple: Tuning Request
  required: false
  description: XSOAR incident type used for tuning review incidents raised for recurring
    detections. Must exist in this tenant; if empty the default type is used.
  playbookInputQuery: null
outputs:
- contextPath: CanonicalIncident
  description: Vendor-neutral canonical incident object.
  type: unknown
- contextPath: IncidentIndicators
  description: Enriched indicators associated with the incident.
  type: unknown
- contextPath: RecurrenceCount
  description: Number of previous incidents with the same name within the recurrence
    lookback window.
  type: unknown
dirtyInputs: true
