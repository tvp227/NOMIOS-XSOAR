    type: condition
    task:
      id: 4cb81562-320a-4e68-917f-49f59d426cb4
      version: -1
      name: ESCALATION MATRIX
      description: |-
        Evaluated in order:
        1. ESCALATE when any indicator has a malicious or suspicious GTI verdict.
        2. RECURRING when the same incident name has been seen at least
           RecurrenceThreshold times within RecurrenceLookbackDays - raises a
           tuning review incident, then escalates.
        3. AUTO CLOSE only when severity is in the configured auto-close list.
        Anything unmatched escalates (fail-safe default).
      type: condition
      iscommand: false
      brand: ""
    nexttasks:
      AUTO-CLOSE:
      - "15"
      ESCALATE:
      - "13"
      INFRASTRUCTURE ALERT:
      - "29"
      RECURRING:
      - "25"
    separatecontext: false
    conditions:
    - label: RECURRING
      condition:
      - - operator: greaterThan
          left:
            value:
              simple: RecurrenceCount
            iscontext: true
          right:
            value:
              simple: "5"
    - label: ESCALATE
      condition:
      - - operator: isTrue
          left:
            value:
              simple: IncidentIndicators.HasGTIMaliciousOrSuspicious
            iscontext: true
        - operator: isEqualNumber
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: "3"
        - operator: isEqualNumber
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: "4"
    - label: AUTO-CLOSE
      condition:
      - - operator: isEqualNumber
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: "1"
        - operator: isEqualString
          left:
            value:
              simple: CanonicalIncident.severity
            iscontext: true
          right:
            value:
              simple: "2"
    - label: INFRASTRUCTURE ALERT
      condition:
      - - operator: startWith
          left:
            value:
              simple: incident.title
            iscontext: true
          right:
            value:
              simple: INF
