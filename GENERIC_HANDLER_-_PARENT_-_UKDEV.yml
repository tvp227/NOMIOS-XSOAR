      version: -1
      name: SYNC - SENTINEL - UKDEV
      description: |-
        Microsoft Sentinel ingest and investigate sub-playbook.

        Responsibilities (all Sentinel-specific logic lives here):
          1. Parse subscription / resource group / incident ID from the incident URL (once).
          2. Pull incident entities and normalise them (SentinelEntityExtraction).
          3. Capture the triggering analytics rule and re-run its query.
          4. Map Sentinel severity to the canonical 1-4 priority scale.
          5. Build the vendor-neutral CanonicalIncident object.

        Output contract (consumed by GENERIC HANDLER - PARENT):
          - CanonicalIncident   vendor-neutral incident object
          - ExtractedEntities   flat list of entity values for indicator handling
      playbookName: SYNC - SENTINEL - UKDEV
      type: playbook
