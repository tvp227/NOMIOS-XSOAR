name: SYNC - SENTINEL - UKDEV
description: |-
  Microsoft Sentinel write-back adapter, outbound half. ADAPTER CONTRACT v1.0.
  Posts the triage narrative as an idempotent comment, then mirrors the outcome onto the
  Sentinel status, labels and owner. No decision logic and no AI calls live here.
  Inbound (Sentinel to XSOAR) is handled by native Incoming mirroring on the instance,
  not by this playbook. Errors propagate to the parent, which continues regardless.
  Input contract: Comment, Disposition (ESCALATED | RECURRING | AUTO-CLOSED |
  MANUAL-REVIEW), Classification, ClassificationReason, RunId, MarkActiveOnEscalate,
  OwnerUPN, Tags.
