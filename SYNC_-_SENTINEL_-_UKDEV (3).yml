inputs:
- key: Comment
  value: {}
  required: true
  description: 'Narrative to post back to the source incident. Never empty: the parent falls back to a
    deterministic narrative.'
  playbookInputQuery: null
- key: Disposition
  value: {}
  required: true
  description: ESCALATED, RECURRING, AUTO-CLOSED or MANUAL-REVIEW. Drives the comment prefix, the status
    and the labels.
  playbookInputQuery: null
- key: RunId
  value: {}
  required: true
  description: Idempotency marker. Comments are prefixed with it and skipped if already present, so reruns
    never double-post.
  playbookInputQuery: null
- key: Classification
  value:
    simple: Undetermined
  required: true
  description: 'Sentinel classification used when closing: Undetermined, BenignPositive, FalsePositive
    or TruePositive.'
  playbookInputQuery: null
- key: ClassificationReason
  value:
    simple: UNSET
  required: true
  description: InaccurateData, IncorrectAlertLogic, SuspiciousActivity or SuspiciousButExpected. The sentinel
    value UNSET is stripped before the call.
  playbookInputQuery: null
- key: MarkActiveOnEscalate
  value:
    simple: 'true'
  required: true
  description: If true, non-closing dispositions set the source incident to Active. Set false for customers
    who manage status themselves.
  playbookInputQuery: null
- key: OwnerUPN
  value: {}
  required: false
  description: Optional. UPN to set as owner on the source incident. Left blank means the owner is not
    touched.
  playbookInputQuery: null
- key: Tags
  value:
    simple: XSOAR-Triaged
  required: true
  description: Comma-separated labels applied to the source incident. Merged with existing labels, never
    replacing them.
  playbookInputQuery: null
outputs: []
